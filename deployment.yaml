apiVersion: apps/v1
kind: Deployment

metadata:
  name: college-placement-portal

spec:
  replicas: 3

  selector:
    matchLabels:
      app: college-placement-portal

  template:
    metadata:
      labels:
        app: college-placement-portal

    spec:
      containers:
        - name: college-placement-portal
          image: balaji00002/college-placement-portal:v1

          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: college-placement-portal-service

spec:
  type: NodePort

  selector:
    app: college-placement-portal

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082